<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy 群聊 Bot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1f2328; --muted: #6b7280;
    --border: #e3e3df; --me: #d9ecff; --bot: #ffffff; --accent: #c9400e;
    --err-bg: #fdecea; --err-text: #9b1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2023; --text: #e7e7e4; --muted: #9a9ca1;
      --border: #313236; --me: #23384d; --bot: #24262a; --accent: #ff7a45;
      --err-bg: #3a1d1d; --err-text: #ffb4ab;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; max-width: 860px; margin: 0 auto; padding: 0 16px;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  #health { display: none; background: var(--err-bg); color: var(--err-text);
            border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px; }
  #health ul { margin: 4px 0 0; padding-left: 18px; }
  #log { flex: 1; overflow-y: auto; padding: 8px 0; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border);
         overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--me); white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--bot); }
  .msg.bot p:first-child { margin-top: 0; } .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot table { border-collapse: collapse; } .msg.bot td, .msg.bot th { border: 1px solid var(--border); padding: 2px 6px; }
  .msg.error { background: var(--err-bg); color: var(--err-text); }
  .msg.thinking { color: var(--muted); font-style: italic; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 0; align-items: center; }
  form { display: flex; gap: 8px; padding: 0 0 16px; }
  textarea { flex: 1; resize: none; height: 46px; padding: 10px 12px; border-radius: 10px;
             border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; }
  button { border: 1px solid var(--border); background: var(--panel); color: var(--text);
           border-radius: 10px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=date] { border: 1px solid var(--border); background: var(--panel); color: var(--text);
                     border-radius: 8px; padding: 6px 8px; font: inherit; }
  .hint { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>🏀 Ben's 2027 League Bot</h1>
  <button id="reset" type="button">新对话</button>
</header>
<div id="health"></div>
<div class="actions">
  <button id="pregame" type="button">赛前情报</button>
  <button id="postgame" type="button">赛后报告</button>
  <input id="postdate" type="date" title="赛后报告日期（留空 = 自动）">
  <span class="hint">日期留空则自动选最近打完的一天</span>
</div>
<div id="log"></div>
<form id="form">
  <textarea id="input" placeholder="问点什么，比如：联赛现在谁第一？差距多少？（Enter 发送，Shift+Enter 换行）"></textarea>
  <button class="primary" id="send" type="submit">发送</button>
</form>
<script>
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const buttons = ["send", "pregame", "postgame", "reset"].map(id => document.getElementById(id));
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
  let sessionId = newId();

  function render(md) {
    if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(md));
    const div = document.createElement("div");
    div.textContent = md;
    return div.innerHTML.replace(/\n/g, "<br>");
  }

  function add(cls, text, isMarkdown) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    if (isMarkdown) el.innerHTML = render(text); else el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function call(url, body, label) {
    buttons.forEach(b => b.disabled = true);
    const pending = add("bot thinking", label || "思考中…");
    try {
      const r = await fetch(url, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body || {}),
      });
      const data = await r.json().catch(() => ({}));
      pending.remove();
      if (!r.ok) add("bot error", "出错了：" + (data.detail || r.status));
      else add("bot", data.reply, true);
    } catch (e) {
      pending.remove();
      add("bot error", "请求失败：" + e);
    } finally {
      buttons.forEach(b => b.disabled = false);
      input.focus();
    }
  }

  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    add("me", text);
    input.value = "";
    call("/api/chat", {session_id: sessionId, message: text});
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      document.getElementById("form").requestSubmit();
    }
  });
  document.getElementById("pregame").onclick = () => {
    add("me", "生成赛前情报");
    call("/api/report/pregame", {}, "收集赛程和伤病中…");
  };
  document.getElementById("postgame").onclick = () => {
    const date = document.getElementById("postdate").value || null;
    add("me", "生成赛后报告" + (date ? `（${date}）` : ""));
    call("/api/report/postgame", {date}, "翻 box score 中…");
  };
  document.getElementById("reset").onclick = async () => {
    await fetch("/api/chat/reset", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: sessionId}),
    }).catch(() => {});
    sessionId = newId();
    log.innerHTML = "";
    add("bot", "新对话开始，之前的上下文已清空。");
  };

  fetch("/api/health").then(r => r.json()).then(h => {
    if (h.ok) return;
    const box = document.getElementById("health");
    const bad = h.checks.filter(c => !c.ok);
    box.innerHTML = "<b>配置有问题：</b><ul></ul>";
    const ul = box.querySelector("ul");
    bad.forEach(c => { const li = document.createElement("li"); li.textContent = `${c.name}：${c.detail}`; ul.appendChild(li); });
    box.style.display = "block";
  }).catch(() => {});
</script>
</body>
</html>
